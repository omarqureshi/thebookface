# Local development dependencies. The app itself runs under plain Puma
# (bin/rails server); these back it: DynamoDB for data, MinIO as a local,
# S3-compatible store for media. The `tests` service (profile: test) runs the
# Cucumber suite — including headless Chrome — on the same network.
services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb"]
    ports:
      - "8000:8000"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console

  # One-shot: create the media buckets (dev + test), make objects publicly
  # readable (standing in for CloudFront), and exit.
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      for b in bookface-media test-bookface-media; do
        mc mb --ignore-existing local/$$b;
        mc anonymous set download local/$$b;
      done;
      echo 'minio ready';
      "

  # Cucumber suite in a container with Chromium (profile: test — not started by
  # a plain `docker compose up`). Run:
  #   docker compose --profile test run --rm tests
  tests:
    build:
      context: .
      dockerfile: Dockerfile.test
    depends_on:
      dynamodb:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "until curl -s -o /dev/null http://dynamodb:8000; do echo 'waiting for dynamodb'; sleep 1; done;
      bundle exec rspec && bundle exec cucumber"
    environment:
      RAILS_ENV: test
      SECRET_KEY_BASE: test-secret-key-base
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      MEDIA_ENDPOINT: http://minio:9000
      MEDIA_PUBLIC_URL: http://minio:9000/test-bookface-media
      MEDIA_BUCKET: test-bookface-media
      MEDIA_ACCESS_KEY_ID: minioadmin
      MEDIA_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - .:/app
    profiles: ["test"]
