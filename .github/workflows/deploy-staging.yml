name: Deploy Staging

# Staging tracks the `staging` branch, not main: merge a feature there to
# validate it on real infra, then promote to main once it's proven. main stays
# pristine (it deploys nothing — production ships from a tag). Also runnable on
# demand against any branch.
on:
  push:
    branches: [staging]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      stack: TheBookface-staging
      environment: staging
    secrets: inherit
