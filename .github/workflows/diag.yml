name: Diag Staging Origin

# Read-only: inspects why the staging Function URL rejects CloudFront's OAC-signed
# request (403 AccessDeniedException). Delete once the origin serves.
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/GitHubActionsCDKRole
          aws-region: us-east-1

      - name: Inspect Function URL auth + resource policy + OAC
        run: |
          set +e   # keep probing even if one call fails
          FN=$(aws cloudformation describe-stack-resources \
            --stack-name TheBookface-staging \
            --query "StackResources[?ResourceType=='AWS::Lambda::Function' && starts_with(LogicalResourceId, 'Rails')].PhysicalResourceId | [0]" \
            --output text)
          echo "### function: $FN"
          echo "### function-url-config:"
          aws lambda get-function-url-config --function-name "$FN" \
            --query '{AuthType:AuthType,InvokeMode:InvokeMode}' --output json
          echo "### resource policy (the CloudFront-invoke permission):"
          aws lambda get-policy --function-name "$FN" --query Policy --output text 2>/dev/null \
            | jq '.Statement' || echo "!! NO resource-based policy on the function"
          DIST=$(aws cloudfront list-distributions \
            --query "DistributionList.Items[?Aliases.Items[?@=='staging.thebookface.net']].Id | [0]" --output text)
          echo "### app distribution id: $DIST"
          echo "### expected SourceArn: arn:aws:cloudfront::${{ vars.AWS_ACCOUNT_ID }}:distribution/$DIST"
          echo "### origins + OAC ids:"
          aws cloudfront get-distribution-config --id "$DIST" \
            --query 'DistributionConfig.Origins.Items[].{Id:Id,Domain:DomainName,OAC:OriginAccessControlId}' --output json
          echo "### distribution status:"
          aws cloudfront get-distribution --id "$DIST" --query 'Distribution.Status' --output text
          echo "### OAC config (must be lambda / always / sigv4):"
          OACID=$(aws cloudfront get-distribution-config --id "$DIST" \
            --query 'DistributionConfig.Origins.Items[0].OriginAccessControlId' --output text)
          aws cloudfront get-origin-access-control --id "$OACID" \
            --query 'OriginAccessControl.OriginAccessControlConfig' --output json
          echo "### default behavior (origin-request policy forwards which headers?):"
          ORP=$(aws cloudfront get-distribution-config --id "$DIST" \
            --query 'DistributionConfig.DefaultCacheBehavior.OriginRequestPolicyId' --output text)
          echo "originRequestPolicyId: $ORP"
          aws cloudfront get-origin-request-policy --id "$ORP" \
            --query 'OriginRequestPolicy.OriginRequestPolicyConfig.{Headers:HeadersConfig,Cookies:CookiesConfig.CookieBehavior,Query:QueryStringsConfig.QueryStringBehavior}' --output json
